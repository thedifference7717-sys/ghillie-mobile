# Builds CAMO's wallet library + the bridge as one static library for iPhone/iPad (arm64; artifact
# ios-libcamo_wallet-arm64) and for the iOS simulator on Intel Macs (x86_64; artifact ios-libcamo_wallet-sim-x86_64),
# and checks that an executable links against each.
name: ios wallet library
on:
  workflow_dispatch:
  push:
    paths: ['native/camo_wallet_ffi.*', 'native/ios/**', '.github/workflows/ios-lib.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: device
            artifact: ios-libcamo_wallet-arm64
          - target: sim-x86_64
            artifact: ios-libcamo_wallet-sim-x86_64
    name: build (${{ matrix.target }})
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: get camo
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/thedifference7717-sys/camo.git camo
      - name: tools
        run: brew install autoconf automake libtool pkg-config cmake || true
      - name: restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: work/prefix-${{ matrix.target }}
          key: ios-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ios-${{ matrix.target }}-
      - name: build
        run: |
          TARGET=${{ matrix.target }} bash native/ios/build-ios-lib.sh camo work
          mkdir -p up && cp work/out/libcamo_wallet-${{ matrix.target }}.a up/libcamo_wallet.a
      # keep finished dependencies even when a later step fails, so the next attempt resumes
      - name: save dependency cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: work/prefix-${{ matrix.target }}
          key: ios-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: up/libcamo_wallet.a
