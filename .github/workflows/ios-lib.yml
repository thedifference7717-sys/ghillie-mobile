# Builds CAMO's wallet library + the bridge for iPhone/iPad (arm64) as one static library, and checks that an iOS
# executable links against it. Artifact: ios-libcamo_wallet-arm64.
name: ios wallet library
on:
  workflow_dispatch:
  push:
    paths: ['native/camo_wallet_ffi.*', 'native/ios/**', '.github/workflows/ios-lib.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: get camo
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/thedifference7717-sys/camo.git camo
      - name: tools
        run: brew install autoconf automake libtool pkg-config cmake || true
      - name: restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: work/prefix
          key: ios-prefix-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ios-prefix-
      - name: build
        run: bash native/ios/build-ios-lib.sh camo work
      # keep finished dependencies even when a later step fails, so the next attempt resumes
      - name: save dependency cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: work/prefix
          key: ios-prefix-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v5
        with:
          name: ios-libcamo_wallet-arm64
          path: work/out/libcamo_wallet.a
